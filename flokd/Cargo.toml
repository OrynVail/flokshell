[package]
name = "flokd"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
base64 = "0.23.1"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif", "tiff", "bmp"] }
libc = "0.2"
lofty = "0.25.5"
notify = "8"
nvml-wrapper = "0.13.0"
percent-encoding = "2.3.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
tl = "0.7.8"
tokio = { version = "1", features = ["rt", "macros", "net", "sync", "time", "fs", "io-util", "signal", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5.8"
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
zbus = { version = "6.1.0", default-features = false, features = ["tokio"] }

# rustls over openssl: no native TLS to thread through the Nix build.
[dependencies.reqwest]
version = "0.13"
default-features = false
features = ["json", "query", "rustls", "gzip", "multipart"]

[profile.release]
lto = true
codegen-units = 1
strip = true
