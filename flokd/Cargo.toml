[package]
name = "flokd"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
notify = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "net", "sync", "time", "fs", "io-util", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zbus = { version = "6.1.0", default-features = false, features = ["tokio"] }

# rustls over openssl: no native TLS to thread through the Nix build.
[dependencies.reqwest]
version = "0.12"
default-features = false
features = ["json", "rustls-tls", "gzip"]

[profile.release]
lto = true
codegen-units = 1
strip = true
